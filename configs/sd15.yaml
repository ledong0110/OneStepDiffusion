extends: base.yaml
output_dir: runs/sd15/baseline_seed42
model:
  family: stable-diffusion
  source: stable-diffusion-v1-5/stable-diffusion-v1-5
  revision: 451f4fe16113bff5a5d2269ed5ad43b0592e9a14
  lora_rank: 32
  guidance_scale: 7.5
  gradient_checkpointing: true
data:
  dataset: COCO-2017
  image_size: 512
  root: data/coco2017
  batch_size: 1
  train_limit: 5000
  download_workers: 12
train:
  updates_per_stage: 500
  grad_accumulation: 4
  learning_rate: 0.0001
  warmup_steps: 25
  ema_decay: 0.995
  save_every: 100
  log_every: 5
  preview_every: 500
eval:
  num_samples: 1000
  num_real: 1000
  reference_split: validation
  batch_size: 4
  benchmark_repeats: 10
